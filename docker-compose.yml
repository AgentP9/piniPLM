services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/pini_plm.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  backend_data:
